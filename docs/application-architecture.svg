<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Document to Structured Data application architecture</title>
  <desc id="diagram-desc">A left-to-right architecture diagram showing a Next.js workspace sending PDF extraction requests to a FastAPI backend. The backend validates requests, parses PDFs with LiteParse and Docling, chooses either deterministic automatic extraction or schema-driven extraction through compact candidates and OpenRouter, validates the result against local Markdown, and returns JSON and CSV to the review and export interface. Uploads are processed in memory and temporary working directories and are not persisted.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#354052"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 15px Arial, Helvetica, sans-serif; fill: #667085; }
      .zone-label { font: 700 13px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; fill: #475467; }
      .node-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #172033; }
      .node-tech { font: 13px Arial, Helvetica, sans-serif; fill: #667085; }
      .node-note { font: 12px Arial, Helvetica, sans-serif; fill: #667085; }
      .edge { fill: none; stroke: #354052; stroke-width: 2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: #354052; stroke-width: 2; }
      .edge-bidir { fill: none; stroke: #354052; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edge-label { font: 12px Arial, Helvetica, sans-serif; fill: #53627a; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .zone { stroke: #344054; stroke-width: 1.3; stroke-dasharray: 6 7; }
      .cloud-boundary { stroke: #7AA889; stroke-width: 1.3; }
      .node { stroke: #98A2B3; stroke-width: 1.4; }
      .file { fill: #F7F8FA; }
      .runtime { fill: #EAF3FF; }
      .process { fill: #FFF6D9; }
      .cloud { fill: #EAF7EF; }
      .output { fill: #EAF3FF; }
      .small-pill { fill: #F5F6F8; stroke: #D0D5DD; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1700" height="760" fill="#FFFFFF"/>

  <text x="70" y="68" class="title">Document to Structured Data — application architecture</text>

  <!-- Purposeful system boundaries -->
  <rect x="50" y="160" width="250" height="480" rx="18" class="zone runtime" fill-opacity="0.55"/>
  <text x="76" y="193" class="zone-label">CLIENT</text>

  <rect x="365" y="160" width="875" height="480" rx="18" class="zone process" fill-opacity="0.58"/>
  <text x="391" y="193" class="zone-label">LOCAL PROCESSING / PYTHON</text>

  <rect x="1270" y="160" width="380" height="480" rx="18" class="zone output" fill-opacity="0.55"/>
  <text x="1296" y="193" class="zone-label">CLIENT</text>

  <!-- External service boundary -->
  <rect x="1230" y="35" width="400" height="86" rx="16" class="cloud-boundary cloud" fill-opacity="0.7"/>
  <text x="1430" y="73" text-anchor="middle" class="node-title" font-size="15">LLM</text>
  <text x="1430" y="96" text-anchor="middle" class="node-tech">Mistral Small 3</text>

  <!-- Client -->
  <rect x="70" y="235" width="210" height="90" rx="14" class="node runtime"/>
  <text x="175" y="270" text-anchor="middle" class="node-title">User</text>
  <text x="175" y="292" text-anchor="middle" class="node-tech">upload PDF</text>
  <text x="175" y="315" text-anchor="middle" class="node-note">choose a mode</text>

  <rect x="70" y="424" width="210" height="78" rx="14" class="node file"/>
  <text x="175" y="458" text-anchor="middle" class="node-title">Request payload</text>
  <text x="175" y="480" text-anchor="middle" class="node-tech">PDF and schema</text>

  <path d="M175 325 V424" class="edge"/>
  <text x="190" y="378" class="edge-label">configures</text>

  <!-- Backend primary path -->
  <rect x="400" y="292" width="205" height="96" rx="14" class="node runtime"/>
  <text x="502" y="322" text-anchor="middle" class="node-title">Extraction API</text>
  <text x="502" y="344" text-anchor="middle" class="node-tech">Python web service</text>
  <text x="502" y="368" text-anchor="middle" class="node-note">checks input, runs extraction</text>

  <rect x="655" y="292" width="230" height="96" rx="14" class="node process"/>
  <text x="770" y="322" text-anchor="middle" class="node-title">Hybrid PDF Parser</text>
  <text x="770" y="344" text-anchor="middle" class="node-tech">LiteParse – Markdown</text>
  <text x="770" y="368" text-anchor="middle" class="node-note">Docling – tables and OCR</text>

  <rect x="935" y="292" width="230" height="96" rx="14" class="node file"/>
  <text x="1050" y="322" text-anchor="middle" class="node-title">Parsed PDF data</text>
  <text x="1050" y="344" text-anchor="middle" class="node-tech">Markdown and tables</text>
  <text x="1050" y="368" text-anchor="middle" class="node-note">shared mapper input</text>

  <path d="M280 463 H330 V339 H400" class="edge"/>
  <text x="310" y="453" text-anchor="middle" class="edge-label">submits</text>
  <path d="M605 340 H655" class="edge"/>
  <text x="630" y="330" text-anchor="middle" class="edge-label">valid PDF</text>
  <path d="M885 340 H935" class="edge"/>
  <text x="910" y="330" text-anchor="middle" class="edge-label">builds</text>

  <!-- Extraction mode split -->
  <path d="M1050 388 V442 H785 V478" class="edge"/>
  <path d="M1050 442 H1058 V478" class="edge"/>
  <text x="1067" y="433" class="edge-label">selects mode</text>

  <rect x="672" y="478" width="226" height="112" rx="14" class="node process"/>
  <text x="785" y="512" text-anchor="middle" class="node-title">Automatic mapper</text>
  <text x="785" y="534" text-anchor="middle" class="node-tech">Rule-based extraction</text>
  <text x="785" y="561" text-anchor="middle" class="node-note">finds fields, tables, and review items</text>
  <text x="785" y="579" text-anchor="middle" class="node-note">uses structure and positions</text>

  <rect x="945" y="478" width="226" height="112" rx="14" class="node process"/>
  <text x="1058" y="512" text-anchor="middle" class="node-title">Schema mapper</text>
  <text x="1058" y="534" text-anchor="middle" class="node-tech">LLM-based extraction</text>
  <text x="1058" y="561" text-anchor="middle" class="node-note">matches requested fields and rows</text>

  <path d="M785 590 V620 H1245 V402 H1300" class="edge"/>
  <path d="M1058 590 V620 H1245" class="edge-plain"/>

  <!-- Model exchange -->
  <path d="M1171 478 V78 H1230" class="edge-bidir"/>

  <!-- Result surface -->
  <rect x="1300" y="360" width="320" height="84" rx="14" class="node output"/>
  <text x="1460" y="393" text-anchor="middle" class="node-title" font-size="15">Output</text>
  <text x="1460" y="416" text-anchor="middle" class="node-tech">JSON and CSV</text>
</svg>
